name: Embed Signals

on:
  schedule:
    - cron: "30 */6 * * *"   # 30 min after each ingest run, every 6 hours
  workflow_dispatch: {}

jobs:
  embed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    env:
      # fastembed downloads the model here on first use; cached below so it
      # isn't re-downloaded on every run.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ingestion/requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          # Bump the suffix to force a fresh download.
          key: fastembed-${{ runner.os }}-all-MiniLM-L6-v2-v1
      - name: Run embedding job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m jobs.embed_signals
