name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets here on purpose: the build must work without them (lib/db.ts and
# lib/neo4j.ts connect on first use, and every page is dynamic).
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ingestion/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
