# Render Blueprint for the ingestion HTTP API (services/ingestion/main.py).
# Render reads this file from the repo root. Secrets are marked sync: false,
# so Render asks for their values when the Blueprint is first applied.
services:
  - type: web
    name: brew-ingestion
    runtime: python
    plan: free
    rootDir: services/ingestion
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_KEY
        sync: false
